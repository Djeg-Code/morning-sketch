<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dessin" />
<meta name="theme-color" content="#0c0c0e" />
<title>Un dessin par jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">

  <!-- Image plein écran -->
  <div id="stage">
    <div id="imgwrap"><img id="img" alt="" draggable="false" /></div>
  </div>

  <!-- Chargement : motion seul, aucun texte -->
  <div class="panel" id="loading">
    <svg id="load-mark" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 40 C 20 8, 44 8, 56 40" />
    </svg>
  </div>

  <!-- Erreur : signe discret, écran tappable pour relancer -->
  <div class="panel" id="error"><span class="sign"></span></div>

  <!-- Pool épuisée : signe discret -->
  <div class="panel" id="empty"><span class="sign"></span></div>

  <!-- Dessiné aujourd'hui : fond fixe #0c0c0e + citation assignée à l'image (étape 6).
       Bloc centré ; citation alignée à gauche, auteur ferré à droite en signature. -->
  <div class="panel" id="done">
    <figure id="quote">
      <blockquote id="quote-text"></blockquote>
      <figcaption id="quote-author"></figcaption>
    </figure>
  </div>

  <!-- Retour visuel des gestes (anneau + coche, sans légende) -->
  <div id="fx">
    <div class="ring" id="ring"></div>
    <svg id="ck" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>
  </div>

  <!-- Écran de première utilisation : 2 CTA (SEULE exception au zéro-texte, étape 3) -->
  <div id="seed-cta">
    <button id="seed-new" type="button">seed</button>
    <button id="seed-ok" type="button">valider</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
